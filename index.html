<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fellowship Navigation</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Leaflet Maps CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Routing Machine CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        #map {
            height: 100vh;
            width: 100vw;
        }

        /* Live status banner overlay */
        #status-banner {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(15, 23, 42, 0.92);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
            width: 85%;
            max-width: 380px;
            pointer-events: auto;
            cursor: pointer;
        }

        /* Permanent landmark badge styles */
        .landmark-label {
            background-color: #0f172a;
            color: #ffffff;
            border: 1px solid #38bdf8;
            border-radius: 6px;
            padding: 3px 8px;
            font-weight: bold;
            font-size: 11px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        /* Pulsing indicator for live location */
        .user-position-icon {
            width: 18px;
            height: 18px;
            background-color: #2563eb;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.9);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7);
            }

            70% {
                box-shadow: 0 0 0 14px rgba(37, 99, 235, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(37, 99, 235, 0);
            }
        }

        .leaflet-routing-container {
            background: rgba(15, 23, 42, 0.9) !important;
            color: #ffffff !important;
            border-radius: 12px;
            max-height: 180px;
            overflow-y: auto;
            font-size: 12px;
        }

        .leaflet-routing-alt {
            color: #ffffff !important;
        }
    </style>
</head>

<body>
    <div id="status-banner" onclick="retryGPS()">📡 Initializing live navigation...</div>
    <div id="map"></div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const statusBanner = document.getElementById('status-banner');

        function getURLParam(key) {
            const searchParams = new URLSearchParams(window.location.search);
            if (searchParams.has(key)) return searchParams.get(key);

            if (window.location.hash) {
                const hashString = window.location.hash.substring(1);
                const hashParams = new URLSearchParams(hashString.includes('?') ? hashString.split('?')[1] : hashString);
                if (hashParams.has(key)) return hashParams.get(key);
            }

            const match = new RegExp('[?&]' + key + '=([^&#]*)').exec(window.location.href);
            return match ? decodeURIComponent(match[1].replace(/\+/g, ' ')) : null;
        }

        const destKey = getURLParam('dest') || 'church';
        const startType = getURLParam('start') || 'gps';

        const locations = {
            gate: {
                name: "University Gate [Toni]",
                coords: [9.616223333752004, 41.840802330192034],
                icon: "🏫"
            },
            church: {
                name: "West MKC Church",
                coords: [9.608728675889507, 41.8406279766799],
                icon: "📍"
            },
            chapel: {
                name: "Chapel",
                coords: [9.61657255310512, 41.84273154415636],
                icon: "⛪"
            }
        };

        const targetDestination = locations[destKey] || locations['church'];

        const map = L.map('map', { zoomControl: true }).setView(targetDestination.coords, 16);

        const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: 'Google Satellite'
        });

        const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: 'OpenStreetMap'
        });

        googleHybrid.addTo(map);

        L.control.layers({
            "Satellite (Google)": googleHybrid,
            "Street Map": streetLayer
        }, null, { position: 'topright' }).addTo(map);

        Object.keys(locations).forEach((key) => {
            const loc = locations[key];
            const marker = L.marker(loc.coords).addTo(map);
            marker.bindTooltip(`${loc.icon} ${loc.name}`, {
                permanent: true,
                direction: 'top',
                className: 'landmark-label'
            });
        });

        let routingControl = null;
        let userMarker = null;
        let isInitialZoomDone = false;

        const userLiveIcon = L.divIcon({
            className: 'user-position-icon',
            iconSize: [18, 18],
            iconAnchor: [9, 9]
        });

        function updateRoute(startCoords, startName) {
            statusBanner.innerText = `🚶 Guiding to ${targetDestination.name} (from ${startName})`;

            if (!routingControl) {
                routingControl = L.Routing.control({
                    waypoints: [
                        L.latLng(startCoords[0], startCoords[1]),
                        L.latLng(targetDestination.coords[0], targetDestination.coords[1])
                    ],
                    router: L.Routing.osrmv1({
                        serviceUrl: 'https://router.project-osrm.org/route/v1',
                        profile: 'foot'
                    }),
                    routeWhileDragging: false,
                    addWaypoints: false,
                    draggableWaypoints: false,
                    showAlternatives: false,
                    collapsible: true,
                    lineOptions: {
                        styles: [{ color: '#38bdf8', opacity: 0.9, weight: 6 }]
                    }
                }).addTo(map);
            } else {
                routingControl.setWaypoints([
                    L.latLng(startCoords[0], startCoords[1]),
                    L.latLng(targetDestination.coords[0], targetDestination.coords[1])
                ]);
            }

            // Fit map view to show both user and destination
            if (!isInitialZoomDone) {
                const bounds = L.latLngBounds([startCoords, targetDestination.coords]);
                map.fitBounds(bounds, { padding: [60, 60] });
                isInitialZoomDone = true;
            }
        }

        function handleGPSSuccess(position) {
            const userCoords = [position.coords.latitude, position.coords.longitude];

            if (!userMarker) {
                userMarker = L.marker(userCoords, { icon: userLiveIcon })
                    .addTo(map)
                    .bindPopup("<b>📱 You are here</b>");
            } else {
                userMarker.setLatLng(userCoords);
            }

            updateRoute(userCoords, "Your Live Location");
        }

        function handleGPSError(error) {
            console.warn("GPS acquire error:", error);
            statusBanner.innerText = `⚠️ GPS disabled/unavailable. Tap to retry or routing from Gate.`;
            updateRoute(locations.gate.coords, `${locations.gate.name} (Fallback)`);
        }

        function acquireGPS() {
            statusBanner.innerText = `📡 Locating your GPS position...`;

            if ("geolocation" in navigator) {
                // High accuracy request with fallback to standard accuracy
                navigator.geolocation.getCurrentPosition(
                    (pos) => handleGPSSuccess(pos),
                    (err) => {
                        console.warn("High accuracy failed, attempting standard GPS...", err);
                        navigator.geolocation.getCurrentPosition(
                            (pos) => handleGPSSuccess(pos),
                            (err2) => handleGPSError(err2),
                            { enableHighAccuracy: false, timeout: 15000, maximumAge: 10000 }
                        );
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );

                // Continuous movement tracking
                navigator.geolocation.watchPosition(
                    (pos) => {
                        const updatedCoords = [pos.coords.latitude, pos.coords.longitude];
                        if (userMarker) {
                            userMarker.setLatLng(updatedCoords);
                        }
                    },
                    null,
                    { enableHighAccuracy: false, maximumAge: 5000 }
                );
            } else {
                handleGPSError("Not supported");
            }
        }

        function retryGPS() {
            if (startType === 'gps') {
                acquireGPS();
            }
        }

        if (startType === 'uni') {
            updateRoute(locations.gate.coords, locations.gate.name);
        } else {
            acquireGPS();
        }
    </script>
</body>

</html>
