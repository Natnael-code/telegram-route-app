<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fellowship Navigation</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Leaflet Maps CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Routing Machine CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        #map {
            height: 100vh;
            width: 100vw;
        }

        /* Live status banner overlay */
        #status-banner {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(15, 23, 42, 0.95);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
            width: 85%;
            max-width: 380px;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        /* Pulsing indicator for live location */
        .user-position-icon {
            width: 18px;
            height: 18px;
            background-color: #2563eb;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.9);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7);
            }

            70% {
                box-shadow: 0 0 0 14px rgba(37, 99, 235, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(37, 99, 235, 0);
            }
        }
    </style>
</head>

<body>
    <div id="status-banner">📡 Initializing GPS & route guidance...</div>
    <div id="map"></div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const statusBanner = document.getElementById('status-banner');

        // Parse query params (?dest=church&start=gps)
        const urlParams = new URLSearchParams(window.location.search);
        const destKey = urlParams.get('dest') || 'church';
        const startType = urlParams.get('start') || 'gps';

        // -----------------------------------------------------------------
        // EXACT PRE-REGISTERED LOCATIONS
        // -----------------------------------------------------------------
        const destinations = {
            church: {
                name: "West MKC Church",
                coords: [9.608728675889507, 41.8406279766799]
            },
            chapel: {
                name: "Chapel",
                coords: [9.61657255310512, 41.84273154415636]
            }
        };

        const uniGate = {
            name: "University Gate [Toni]",
            coords: [9.616223333752004, 41.840802330192034]
        };

        const targetDestination = destinations[destKey] || destinations['church'];

        // Initialize Map
        const map = L.map('map', { zoomControl: true }).setView(targetDestination.coords, 16);

        // Tile Layers (Satellite + Standard Street)
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles © Esri'
        });

        const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });

        // Set Satellite as default background
        satelliteLayer.addTo(map);

        L.control.layers({
            "Satellite": satelliteLayer,
            "Street Map": streetLayer
        }, null, { position: 'topright' }).addTo(map);

        // Add Target Pin
        L.marker(targetDestination.coords)
            .addTo(map)
            .bindPopup(`<b>📍 ${targetDestination.name}</b>`)
            .openPopup();

        let routingControl = null;
        let userMarker = null;

        const userLiveIcon = L.divIcon({
            className: 'user-position-icon',
            iconSize: [18, 18],
            iconAnchor: [9, 9]
        });

        function renderRoute(startCoords, startName) {
            statusBanner.innerText = `🧭 Now guiding you to ${targetDestination.name} (from ${startName})`;

            if (routingControl) {
                map.removeControl(routingControl);
            }

            routingControl = L.Routing.control({
                waypoints: [
                    L.latLng(startCoords[0], startCoords[1]),
                    L.latLng(targetDestination.coords[0], targetDestination.coords[1])
                ],
                router: L.Routing.osrmv1({
                    serviceUrl: 'https://router.project-osrm.org/route/v1',
                    profile: 'foot'
                }),
                routeWhileDragging: false,
                addWaypoints: false,
                draggableWaypoints: false,
                showAlternatives: false,
                lineOptions: {
                    styles: [{ color: '#38bdf8', opacity: 0.9, weight: 6 }]
                }
            }).addTo(map);
        }

        if (startType === 'uni') {
            L.marker(uniGate.coords)
                .addTo(map)
                .bindPopup(`<b>🏫 ${uniGate.name}</b>`);

            renderRoute(uniGate.coords, uniGate.name);
        } else {
            statusBanner.innerText = `📡 Locating your position...`;

            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const userCoords = [position.coords.latitude, position.coords.longitude];

                        if (!userMarker) {
                            userMarker = L.marker(userCoords, { icon: userLiveIcon })
                                .addTo(map)
                                .bindPopup("<b>📱 You are here</b>");

                            renderRoute(userCoords, "Your Live Location");
                        } else {
                            userMarker.setLatLng(userCoords);
                            statusBanner.innerText = `🚶 Now guiding you to ${targetDestination.name} — Tracking your movement live`;
                        }
                    },
                    (error) => {
                        console.warn("GPS error, switching to University Gate [Toni]:", error);
                        statusBanner.innerText = `⚠️ GPS off. Guiding from ${uniGate.name} to ${targetDestination.name}`;

                        L.marker(uniGate.coords)
                            .addTo(map)
                            .bindPopup(`<b>🏫 ${uniGate.name}</b>`);

                        renderRoute(uniGate.coords, uniGate.name);
                    },
                    { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
                );
            } else {
                renderRoute(uniGate.coords, uniGate.name);
            }
        }
    </script>
</body>

</html>
